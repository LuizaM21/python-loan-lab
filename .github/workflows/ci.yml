name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov=loanlab --cov-report=term-missing --junitxml=test-results/junit.xml
      - name: Django lab tests
        working-directory: django_lab
        run: python manage.py test lending
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  perf-smoke:
    name: k6 performance smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Start the API
        run: |
          gunicorn "loanlab.api:create_app()" --preload -w 2 --threads 4 -b 127.0.0.1:5080 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:5080/api/health > /dev/null && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke
        run: k6 run perf/smoke.js

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loanlab:ci .
      - name: Container answers its health check
        run: |
          docker run -d --name api -p 5080:5080 loanlab:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:5080/api/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
