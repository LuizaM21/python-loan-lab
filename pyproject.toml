[project]
name = "loanlab"
version = "1.0.0"
description = "Loan lab: a small lending API for learning Python backend development"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not kata and not exercise'"
markers = [
    "kata: interview algorithm exercises. Run with: pytest -m kata",
    "exercise: design exercises from lessons 11-19, red until you solve them. Run with: pytest -m exercise",
    "mongo: needs mongomock or a MongoDB server",
]
filterwarnings = [
    # SQLite stores NUMERIC as a float; SQLAlchemy converts it back to Decimal and warns.
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["loanlab", "exercises", "katas", "tests"]

[tool.ruff.lint.per-file-ignores]
# Technical debt: the legacy importer breaks these rules. Lesson 19 removes this entry.
"loanlab/legacy/loan_import.py" = ["E711", "E722", "B006", "F841", "SIM115", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["loanlab"]
ignore_missing_imports = true
