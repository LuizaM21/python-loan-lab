# The API with PostgreSQL and MongoDB (lesson 08).
#   docker compose up --build
#   docker compose down -v        # stop and delete the data
services:
  api:
    build: .
    ports:
      - "5080:5080"
    environment:
      DATABASE_URL: postgresql+psycopg://loanlab:loanlab@postgres:5432/loanlab
      # Lesson 06 done? Start with:  MONGO_URL=mongodb://mongo:27017 docker compose up --build
      MONGO_URL: ${MONGO_URL:-}
      RESET_DATABASE: "1"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: loanlab
      POSTGRES_PASSWORD: loanlab           # local only; real secrets never live in a compose file
      POSTGRES_DB: loanlab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanlab -d loanlab"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  mongo-data:
