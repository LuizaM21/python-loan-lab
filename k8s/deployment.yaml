# Lesson 08:  kind create cluster && kind load docker-image loanlab:dev && kubectl apply -f k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loanlab
  labels:
    app: loanlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loanlab
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: loanlab
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: loanlab:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5080
          envFrom:
            - configMapRef:
                name: loanlab-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
